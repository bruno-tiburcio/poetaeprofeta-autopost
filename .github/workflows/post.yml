name: publicar-ig
# Publica o post agendado do dia (pasta agendados/<hoje-BRT>/).
# 09:17 UTC ≈ 06:17 BRT (devocional). Cron do GitHub atrasa alguns min — ok p/ poesia.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      data:
        description: "data YYYY-MM-DD (vazio = hoje BRT)"
        required: false

permissions:
  contents: write   # p/ commitar a pasta movida p/ publicados/

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          POST_DATE: ${{ github.event.inputs.data }}
        run: python publish.py
      - name: arquivar publicados
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: arquiva post publicado" && git push)
